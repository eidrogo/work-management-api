name: work-management-api

x-app-environment: &app-environment
  APP_ENV: development
  DATABASE_URL: postgres://work:work@postgres:5432/work_management?sslmode=disable
  DATABASE_MAX_CONNS: "10"
  LOG_LEVEL: info
  SHUTDOWN_TIMEOUT: 10s

services:
  postgres:
    image: postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
    environment:
      POSTGRES_DB: work_management
      POSTGRES_USER: work
      POSTGRES_PASSWORD: work
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U work -d work_management"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["postgres-data:/var/lib/postgresql/data"]

  mailpit:
    image: axllent/mailpit:v1.30.7@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      <<: *app-environment
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build: .
    entrypoint: ["/app/seed"]
    environment:
      <<: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: .
    entrypoint: ["/app/api"]
    environment:
      <<: *app-environment
      HTTP_ADDR: :8080
      HTTP_MAX_BODY_BYTES: "1048576"
      AUTH_MODE: development
    ports: ["${API_PORT:-8081}:8080"]
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  worker:
    build: .
    entrypoint: ["/app/worker"]
    environment:
      <<: *app-environment
      WORKER_HTTP_ADDR: :9091
      WORKER_ID: compose-worker-1
      WORKER_POLL_INTERVAL: 500ms
      WORKER_BATCH_SIZE: "10"
      LEASE_DURATION: 30s
      MAX_ATTEMPTS: "5"
      RETRY_BACKOFF_BASE: 2s
      RETRY_BACKOFF_MAX: 1h
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: notifications@work-management.test
      SMTP_FROM_NAME: Work Management
      SMTP_TLS_MODE: plain
      SMTP_TIMEOUT: 10s
    ports: ["${WORKER_PORT:-9091}:9091"]
    depends_on:
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9091/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
