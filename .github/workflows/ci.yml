name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
      - run: go mod download
      - run: make fmt-check mod-verify tidy-check vet
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
      - run: make build openapi-check secret-check dockerfile-syntax-test runtime-dockerfile-test compose-config-check docker-build
      - run: make up-cleanup-test
      - name: Complete PostgreSQL, race, stack, demo, listener, and cleanup verification
        run: make compose-smoke
        timeout-minutes: 20
      - run: make clean-check
